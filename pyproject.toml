[project]
name = "cosmograd"
version = "0.1.0"
description = "Differentiable cosmology in JAX behind a small protocol contract."
readme = "README.md"
license = "MIT"
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "jax>=0.10",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.4",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",


    "Programming Language :: Python :: 3.12",


    "Programming Language :: Python :: 3.13",

    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/binado/cosmograd"
Repository = "https://github.com/binado/cosmograd.git"
Issues = "https://github.com/binado/cosmograd/issues"

[project.optional-dependencies]
cosmopower = [
    "cosmopower-jax>=0.5.8",
]
bacco = [
    "baccoemu>=2.3.0",
]


[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
notebook = [
    "cosmograd[bacco,cosmopower]",
    "camb>=1.6.5",
    "matplotlib>=3.10",
    "ipykernel>=6.30",
    "jupytext>=1.17",
    "nbconvert>=7.16",
]
ref = [
    "camb>=1.6.5",
    "cloelib>=0.11",
    "jax-cosmo>=0.1.0",
    # jax-cosmo imports pkg_resources, which setuptools 82 removed.
    "setuptools<81",
]
dev = [
    "cosmograd[bacco,cosmopower]",
    "prek>=0.5.3",
    "ruff>=0.16.0",
    "ty>=0.0.83",
    { include-group = "test" },
    { include-group = "ref" },
]
test = [
    "beartype>=0.23.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra --jaxtyping-packages=cosmograd,tests.typecheck"
markers = ["slow: comparisons against Boltzmann codes or emulators (deselect with -m 'not slow')"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# Jaxtyping shape strings are not Python forward annotations.
ignore = ["F722"]

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.sources]
cosmograd = { workspace = true }
